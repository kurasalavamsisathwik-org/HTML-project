<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart - CaseStore</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>CaseStore</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <div class="container">
    <h2>Your Shopping Cart</h2>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Name</th>
          <th>Model</th>
          <th>Color</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody id="cart-items-container">
        <!-- Starts completely empty until items are added -->
      </tbody>
    </table>

    <div style="text-align: right; margin-top: 20px;">
      <h3 id="cart-total">Total: ₹0</h3>
      <br>
      <button class="btn btn-secondary" style="margin-right: 10px;" onclick="clearCart()">Clear Cart</button>
      <button class="btn" onclick="alert('Proceeding to checkout...')">Checkout</button>
    </div>
  </div>

  <script>
    window.onload = function() {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      const container = document.getElementById("cart-items-container");
      const totalContainer = document.getElementById("cart-total");

      if (cart.length === 0) {
        container.innerHTML = `<tr><td colspan="7" style="color: #777; padding: 30px;">Your cart is empty.</td></tr>`;
        totalContainer.innerText = "Total: ₹0";
        return;
      }

      let html = "";
      let grandTotal = 0;

      cart.forEach(item => {
        let itemTotal = item.price * item.qty;
        grandTotal += itemTotal;

        html += `
          <tr>
            <td><img src="${item.image}" style="width: 45px; height: 45px; object-fit: cover; border-radius: 4px;"></td>
            <td>${item.name}</td>
            <td>${item.model}</td>
            <td><span style="display:inline-block; width:15px; height:15px; background:${item.color}; border-radius:50%; border:1px solid #ccc; vertical-align:middle;"></span></td>
            <td>₹${item.price}</td>
            <td>${item.qty}</td>
            <td>₹${itemTotal}</td>
          </tr>
        `;
      });

      container.innerHTML = html;
      totalContainer.innerText = `Total: ₹${grandTotal}`;
    };

    function clearCart() {
      localStorage.removeItem("cart");
      location.reload();
    }
  </script>

  <footer>
    <p>&copy; 2026 Mobile Case Store. All rights reserved.</p>
  </footer>

</body>
</html>
